
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Encabezado reutilizable -->
    <div th:fragment="encabezado(titulo, descripcion)">
        <div class="page-heading">
            <div>
                <h1 th:text="${titulo}">Título del formulario</h1>
                <p th:text="${descripcion}">
                    Descripción del formulario
                </p>
            </div>
        </div>
    </div>

    <!-- Tarjeta reutilizable -->
    <section th:fragment="tarjeta(titulo, contenido)"
             class="card">

        <h3 class="card-title" th:text="${titulo}">
            Información general
        </h3>

        <div th:replace="${contenido}">
            Contenido del formulario
        </div>

    </section>

    <!-- Botones reutilizables -->
    <div th:fragment="botones(textoGuardar, urlCancelar)"
         class="form-actions">

        <button class="btn btn-primary" type="submit"
                th:text="${textoGuardar}">
            Guardar
        </button>

        <a class="btn btn-secondary"
           th:href="${urlCancelar}">
            Cancelar
        </a>

    </div>

</body>
</html>
