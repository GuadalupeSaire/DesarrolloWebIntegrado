
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${usuario.id == null
        ? 'Registrar usuario'
        : 'Editar usuario'} + ' | GESCONT'">
        Usuario | GESCONT
    </title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<div th:replace="~{fragments/layout :: sidebar('usuarios')}"></div>

<div class="main">

    <header th:replace="~{fragments/layout :: header('Usuarios y Roles')}">
    </header>

    <main class="content">

        <!-- Encabezado reutilizable -->
        <div th:replace="~{fragments/formulario :: encabezado(
            ${usuario.id == null ? 'Nuevo usuario' : 'Editar usuario'},
            'Completa la información del usuario.'
        )}">
        </div>

        <section class="card">

            <h3 class="card-title">Información general</h3>

            <form th:action="@{/usuarios/guardar}"
                  th:object="${usuario}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="form-grid">

                    <!-- Nombres -->
                    <div class="form-group">
                        <label for="nombres">Nombres</label>
                        <input class="form-control"
                               id="nombres"
                               type="text"
                               th:field="*{nombres}"
                               maxlength="80"
                               required>
                    </div>

                    <!-- Apellidos -->
                    <div class="form-group">
                        <label for="apellidos">Apellidos</label>
                        <input class="form-control"
                               id="apellidos"
                               type="text"
                               th:field="*{apellidos}"
                               maxlength="80"
                               required>
                    </div>

                    <!-- Correo -->
                    <div class="form-group">
                        <label for="correo">Correo electrónico</label>
                        <input class="form-control"
                               id="correo"
                               type="email"
                               th:field="*{correo}"
                               maxlength="150"
                               required>
                    </div>

                    <!-- Estado -->
                    <div class="form-group">
                        <label for="estado">Estado</label>

                        <select class="form-control"
                                id="estado"
                                th:field="*{estado}"
                                required>

                            <option th:value="true">Activo</option>
                            <option th:value="false">Inactivo</option>

                        </select>
                    </div>

                    <!-- Contraseña -->
                    <div class="form-group">
                        <label for="password">Contraseña</label>

                        <input class="form-control"
                            id="password"
                            name="password"
                            type="password"
                            minlength="8"
                            placeholder="Ingrese una contraseña">

                        <small>
                            En un usuario nuevo es obligatoria.
                            Al editar, déjala vacía para conservar la contraseña actual.
                        </small>
                    </div>

                    <!-- Rol -->
                    <div class="form-group">

                        <label for="rolId">Rol</label>

                        <select class="form-control"
                                id="rolId"
                                name="rolId"
                                required>

                            <option value="">
                                Seleccione un rol
                            </option>

                            <option th:each="rol : ${roles}"
                                    th:value="${rol.id}"
                                    th:selected="${rol.id == rolSeleccionadoId}"
                                    th:text="${rol.nombre}">
                            </option>

                        </select>

                    </div>

                    <!-- Empresa asignada -->
                    <div class="form-group">

                        <label for="empresaId">Empresa asignada</label>

                        <select class="form-control"
                                id="empresaId"
                                name="empresaId"
                                required>

                            <option value="">
                                Seleccione una empresa
                            </option>

                            <option th:each="empresa : ${empresas}"
                                    th:value="${empresa.id}"
                                    th:selected="${empresa.id == empresaSeleccionadaId}"
                                    th:text="${empresa.razonSocial}">
                            </option>

                        </select>

                    </div>

                </div>

                <!-- Botones reutilizables -->
                <div th:replace="~{fragments/formulario :: botones(
                    'Guardar usuario',
                    '/usuarios'
                )}">
                </div>

            </form>

        </section>

    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</div>

</body>
</html>
